<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kutuphane Sistemi - Panel</title>
    <link rel="stylesheet" href="../styles/style.css">
    <script>
    (function() {
        const token = localStorage.getItem('kutuphane_token');
        const rol = (localStorage.getItem('kutuphane_rol') || '').toLowerCase();
        const adminAnahtarlar = ['admin', 'super', 'süper', 'super_admin'];
        const isAdmin = adminAnahtarlar.some(k => rol.includes(k));
        if (!token || !isAdmin) {
            alert('Bu sayfa yalnızca admin kullanıcılar içindir.');
            window.location.href = '../login.html';
        }
    })();
    </script>
</head>

<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">
                <img src="../images/ktulogo.png" alt="ktu" class="logo-img">
                Kütüphane Sistemi
            </h1>
            <nav class="nav">
                <a href="index.html" class="nav-link">Panel</a>
                <a href="kitaplar.html" class="nav-link active">Kitaplar</a>
                <a href="uyeler.html" class="nav-link">Üyeler</a>
                <a href="islemler.html" class="nav-link">İşlemler</a>
                <button onclick="handleLogout()" class="btn btn-logout">Çıkış Yap</button>
            </nav>
            <div class="search-box">
                <input type="text" placeholder="Kitapları veya üyeleri ara" class="search-input">
            </div>
        </div>
    </header>
    <main class="main">
        <div class="container">
            <div class="page-header">
                <h2>Kitap Yönetimi</h2>
                <button class="k-add">+ Yeni Kitap Ekle</button>
            </div>

            <div class="books-content">
                <div class="books-stats">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-number">0</div>
                            <div class="stat-label">Toplam Kitap</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">0</div>
                            <div class="stat-label">Ödünç Verilen</div>
                        </div>
                        <div class="stat-card available">
                            <div class="stat-number">0</div>
                            <div class="stat-label">Mevcut Kitap</div>
                        </div>
                        <a href="gec.html" style="text-decoration: none;">
                            <div class="stat-card overdue">
                                <div class="stat-number">0</div>
                                <div class="stat-label">Geç Kalan (Ceza)</div>
                            </div>
                        </a>
                    </div>
                </div>

                <div class="books-table-section">
                    <div class="table-header">
                        <h3>Kitap Listesi</h3>
                        <div class="table-controls">
                            <input type="text" placeholder="Kitap ara..." class="search-table">
                            <select class="filter-select" id="kategoriBilim">
                                <option value="">Tüm Kategoriler</option>
                            </select>
                            <select class="filter-select" id="durumFiltresi">
                                <option value="">Tüm Durumlar</option>
                                <option value="mevcut">Mevcut</option>
                                <option value="odunc">Ödünçte</option>
                                <option value="bakim">Bakımda</option>
                            </select>
                        </div>
                    </div>

                    <div class="books-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>Kitap ID</th>
                                    <th>Kitap Adı</th>
                                    <th>Yazar</th>
                                    <th>Kategori</th>
                                    <th>Durum</th>
                                    <th>İşlemler</th>
                                </tr>
                            </thead>
                            <tbody id="kitapTabloGovdesi">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 Kütüphane Projesi.</p>
        <a href="mailto:458364@ogr.ktu.edu.tr">458364@ogr.ktu.edu.tr</a>
        <br>
        <a href="../anasyafa.html">Anasayfa</a>
    </footer>
    <script src="admin-common.js"></script>
    <script src="admin-common.js"></script>
    <script src="kitaplar-backend.js"></script>
</body>
 
</html>
